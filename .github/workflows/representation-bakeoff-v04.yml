name: EXP-04 · representation bake-off browser validation
on:
  push:
    branches: [research/representation-bakeoff-v04]
    paths:
      - 'research/representation-bakeoff-v04/**'
      - '.github/workflows/representation-bakeoff-v04.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test environment
        working-directory: research/representation-bakeoff-v04
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser comparison — 3 renderers x Light/Dark x desktop/mobile
        working-directory: research/representation-bakeoff-v04
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bakeoff-http.log 2>&1 &
          sleep 2
          node test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp04-desktop-mobile-comparison
          path: research/representation-bakeoff-v04/screenshots/
          retention-days: 30
          if-no-files-found: warn
