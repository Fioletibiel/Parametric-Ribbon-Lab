name: Orbis v06 — build and publish real 3D
on:
  push:
    branches:
      - experiment/orbis-sculpted-surface-v06
    paths:
      - 'experiments/orbis-sculpted-surface-v06/**'
      - '.github/workflows/orbis-sculpted-v06-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbis-v06-preview
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/orbis-sculpted-surface-v06
          path: source
      - uses: actions/checkout@v4
        with:
          ref: main
          path: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax and build
        working-directory: source/experiments/orbis-sculpted-surface-v06
        run: |
          node --check src/main.js
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -n "$(find dist/assets -name '*.js' -size +1k | head -1)"
      - name: Publish new route without replacing other experiments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview/docs/renders/exp03/v06
          cp -a source/experiments/orbis-sculpted-surface-v06/dist/. preview/docs/renders/exp03/v06/
          cd preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/renders/exp03/v06
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "preview(orbis): publish real sculpted 3D model v06"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: orbis-v06-3d-build
          path: source/experiments/orbis-sculpted-surface-v06/dist/
          retention-days: 10
