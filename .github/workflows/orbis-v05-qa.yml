name: Orbis v05 — WebGL browser QA
on:
  push:
    branches: [experiment/orbis-motion-fidelity-v05]
    paths:
      - '.github/workflows/orbis-v05-qa.yml'
      - 'tests/orbis-v05.cjs'
      - 'docs/renders/exp03/v05/index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: WebGL screenshot validation
        run: |
          mkdir -p out
          node tests/orbis-v05.cjs
      - name: Generate browseable quality review
        if: always()
        run: |
          python3 -m pip install Pillow --break-system-packages -q
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64
          src=Path('out'); dst=Path('docs/results/orbis-v05-smoke'); dst.mkdir(parents=True,exist_ok=True)
          for name in ['mobile-dark','mobile-light-speaking','desktop-dark','desktop-light-speaking']:
             p=src/(name+'.png')
             if not p.exists(): continue
             im=Image.open(p).convert('RGB'); im.thumbnail((650,1100),Image.Resampling.LANCZOS)
             im.save(dst/(name+'.jpg'),quality=82,optimize=True)
             (dst/(name+'.b64.txt')).write_text(base64.b64encode((dst/(name+'.jpg')).read_bytes()).decode('ascii'))
          if (src/'checks.json').exists():(dst/'checks.json').write_bytes((src/'checks.json').read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbis-v05-qa
          path: out/
          if-no-files-found: warn
      - name: Publish QA screenshots to experiment branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/results/orbis-v05-smoke/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(orbis): publish browser screenshots and WebGL checks'
          git pull --rebase origin experiment/orbis-motion-fidelity-v05
          git push origin HEAD:experiment/orbis-motion-fidelity-v05
