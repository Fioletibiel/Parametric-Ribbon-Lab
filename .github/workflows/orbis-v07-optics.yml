name: Orbis v07 — optical grading pass 01
on:
  push:
    branches: [research/orbis-reference-geometry-20261127]
    paths:
      - experiments/orbis-reference-geometry-v07/regrade_optics.py
      - .github/workflows/orbis-v07-optics.yml
permissions:
  contents: write
  actions: read
jobs:
  optical-grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/orbis-reference-geometry-20261127
          path: source
      - uses: actions/checkout@v4
        with:
          ref: main
          path: public-results
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: orbis-v07-editable-source-stills
          run-id: 45931379981
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: recovered
      - name: Re-light real 3D surfaces with broad studio environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-pil
          blender -b --threads 4 recovered/orbis_reference_geometry_dark.blend \
            --python source/experiments/orbis-reference-geometry-v07/regrade_optics.py \
            -- output/grade_01.png
          test -s output/grade_01.png
      - name: Keep source and diagnostic separate from production
        run: |
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64
          root=Path('public-results/docs/renders/exp02/orbis-v07')
          root.mkdir(parents=True,exist_ok=True)
          i=Image.open('output/grade_01.png').convert('RGB')
          i.save(root/'grade01.jpg',quality=82,optimize=True)
          raw=(root/'grade01.jpg').read_bytes()
          (root/'grade01.b64.txt').write_text(base64.b64encode(raw).decode('ascii'),encoding='ascii')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbis-v07-optical-grade01-editable
          path: output/
          retention-days: 10
      - name: Publish only visual diagnostic
        run: |
          cd public-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/renders/exp02/orbis-v07/grade01*
          git commit -m "results(orbis-v07): test soft optical studio on real geometry"
          git pull --rebase origin main
          git push origin HEAD:main
