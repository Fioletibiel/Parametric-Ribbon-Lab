name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify documentation and public-only scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          assert (root / 'README.md').is_file()
          assert (root / 'docs/QUALITY_GATES.md').is_file()
          ignored = {'.git'}
          forbidden_dirs = {'private', 'brand-assets', 'references-private'}
          forbidden_ext = {'.blend', '.blend1', '.png', '.jpg', '.jpeg', '.gif', '.exr'}
          files = [p for p in root.rglob('*') if p.is_file() and not any(x in ignored for x in p.parts)]
          for path in files:
              assert not any(part in forbidden_dirs for part in path.parts), path
              # Explicitly allow small, generic CI-generated comparison charts.
              public_results = {'docs/renders/exp01-contact-sheet.jpg', 'docs/renders/exp01-v01-contact-sheet.jpg'}
              assert path.as_posix() in public_results or path.suffix.lower() not in forbidden_ext, path
              assert path.stat().st_size <= 2_000_000, f'Unexpected large tracked file: {path}'
          print(f'Checked {len(files)} tracked or checkout files')
          PY
